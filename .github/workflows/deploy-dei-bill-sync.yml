name: Deploy DEI bill sync Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/dei-bill-sync/**"
      - ".github/workflows/deploy-dei-bill-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Worker (normalize secret whitespace)
        working-directory: workers/dei-bill-sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Normalize common copy/paste formatting without ever printing the secret.
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/^[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^"//; s/"$//')"
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sed -E "s/^'//; s/'\$//")"
          CLOUDFLARE_API_ACCOUNT="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_API_ACCOUNT
          export CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_API_ACCOUNT"
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is empty after normalization"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is empty after normalization"; exit 1; }
          npx --yes wrangler@4 deploy --config wrangler.toml
