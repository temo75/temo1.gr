name: Deploy TEMO Firebase Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'workers/temo1-firebase-bridge/worker.mjs'
      - '.github/workflows/deploy-firebase-bridge.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Deploy Firebase Bridge Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy workers/temo1-firebase-bridge/worker.mjs --name temo1-firebase-bridge --compatibility-date 2026-09-26
