dth:42px;height:42px;min-width:42px;border-radius:13px;font-size:21px}.profileHead h2{font-size:16px}.profileIdentity{flex:1;min-width:0}.profileCallActions{margin-left:auto;display:flex;flex-direction:row;align-items:center;gap:6px;position:relative}.profileCallActions>#profileMore,.profileCallActions>#profileVideo{width:42px;height:42px;min-width:42px;padding:0;border-radius:11px;display:grid;place-items:center;font-size:22px}.profileCallActions>#profileVideo{order:0}.profileCallActions>#profileMore{order:1}.profileCallActions #profileMoreMenu{position:absolute;right:0;top:48px;z-index:8;min-width:132px;padding:7px;background:#102b3b;border:1px solid #285269;border-radius:12px;box-shadow:0 8px 24px #0008;display:flex;flex-direction:column;gap:6px}.profileCallActions #profileMoreMenu[hidden]{display:none}.profileCallActions #profileMoreMenu button{width:100%;text-align:left;padding:9px 11px;border-radius:8px;font-size:14px}.status{padding:18px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.modal.show{display:flex}.modalBox{width:min(280px,100%);background:#10232f;border:1px solid #285269;border-radius:10px;padding:9px}.modalBox h2{font-size:14px;margin:0 0 6px}.modalBox input{margin:6px 0}.modalBox #modalBody{font-size:13px}.modalActions{display:flex;gap:5px}.modalActions button{flex:1;padding:6px 8px;font-size:12px;border-radius:7px}

<script>
(()=>{
const API='https://temo1-firebase-bridge.temo75elia.workers.dev',user=localStorage.getItem('temoWorkTrackerUser')||'',uid=localStorage.getItem('temoWorkTrackerUserId')||'',token=localStorage.getItem('temoFirebaseBridgeSession')||'';
const $=id=>document.getElementById(id);let modalAction=null;

async function ensureMessengerPush(){
 if(location.origin!=='https://temo1.gr'||Notification.permission!=='granted'||!('serviceWorker'in navigator)||!('PushManager'in window))return;
 const me=localStorage.getItem('temoWorkTrackerUserId')||uid;
 const session=localStorage.getItem('temoFirebaseBridgeSession')||token;
 if(!me||!session)return;
 const worker='https://temo-ai.temo75elia.workers.dev';
 const cfg=await fetch(worker+'?action=push-config',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Push config HTTP '+r.status);return r.json()});
 if(!cfg.ok||!cfg.publicKey)throw Error(cfg.error||'Push key unavailable');
 const s=cfg.publicKey.replace(/-/g,'+').replace(/_/g,'/');
 const raw=atob(s+'='.repeat((4-s.length%4)%4)),key=new Uint8Array(raw.length);
 for(let i=0;i<raw.length;i++)key[i]=raw.charCodeAt(i);
 await navigator.serviceWorker.register('/temo-notes-sw.js',{scope:'/'});
 const reg=await navigator.serviceWorker.ready;
 let sub=await reg.pushManager.getSubscription();
 if(sub){const old=sub.options?.applicationServerKey;if(old&& (old.byteLength!==key.length||!key.every((v,i)=>v===new Uint8Array(old)[i]))){await sub.unsubscribe();sub=null;}}
 if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});
 const deviceKey='temoPushDeviceId';let deviceId=localStorage.getItem(deviceKey);
 if(!deviceId){deviceId=crypto.randomUUID?crypto.randomUUID():'d_'+Date.now();localStorage.setItem(deviceKey,deviceId);}
 const response=await fetch(worker,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'push-subscribe',userId:me,sessionToken:session,deviceId,platform:/Android/i.test(navigator.userAgent)?'android-native':'web-push',subscription:sub.toJSON()})});
 const result=await response.json().catch(()=>({}));
 if(!response.ok||!result.ok)throw Error(result.error||('Push subscribe HTTP '+response.status));
}
const call=async(op,data={})=>{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'messenger',op,...data,sessionToken:token})});const j=await r.json();if(!r.ok)throw new Error(j.error||'შეცდომა');return j};
const showModal=(title,html,fn)=>{$('modalTitle').textContent=title;$('modalBody').innerHTML=html;modalAction=fn;$('modal').classList.add('show')};
const closeModal=()=>{$('modal').classList.remove('show');modalAction=null};
$('modalCancel').onclick=closeModal;$('modalOk').onclick=async()=>{if(modalAction)await modalAction();closeModal()};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showStatus(t){$('status').textContent=t}
let people=[],contacts=[],requests=[],directTarget=null,directPoll=null,selectedPerson=null;
function personRow(u){const yes=contacts.some(c=>c.id===u.id);return '<div class="personRow"><button class="personName" data-profile="'+esc(u.id)+'"><svg class="personIcon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.5" r="4.2"/><path d="M3.5 21c.5-4.5 3.8-7 8.5-7s8 2.5 8.5 7"/></svg><span>'+esc(u.name)+'</span></button><span class="personActions">'+(yes?'<button data-chat="'+esc(u.id)+'" title="ჩატის გახსნა" aria-label="ჩატის გახსნა">💬</button><button disabled>✓</button>':'<button data-add="'+esc(u.id)+'">＋ დამატება</button>')+'</span></div>'}
async function loadPeople(){
 [people,contacts,requests]=await Promise.all([call('users'),call('contacts'),call('requests')]);
 $('contacts').innerHTML=contacts.length?contacts.map(personRow).join(''):'<div class="muted">კონტაქტები ჯერ არ არის</div>';
 $('allUsers').innerHTML='<div class="muted">რეგისტრირებული მომხმარებლები</div>'+people.filter(u=>!contacts.some(c=>String(c.id)===String(u.id))).map(personRow).join('');
 $('incomingRequests').innerHTML=requests.length?'<b>მეგობრობის მოთხოვნები</b>'+requests.map(r=>'<div class="requestRow"><span>'+esc(r.name)+'</span><span class="personActions"><button data-accept="'+esc(r.from)+'">მიღება</button><button class="danger" data-reject="'+esc(r.from)+'">უარყოფა</button></span></div>').join(''):'';
 document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>openDirect(b.dataset.profile));
 document.querySelectorAll('[data-add]').forEach(b=>b.onclick=async()=>{try{await call('requestFriend',{targetId:b.dataset.add});showStatus('მოთხოვნა გაგზავნილია');await loadPeople()}catch(e){showStatus(e.message)}});
 document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>openDirect(b.dataset.chat));
 document.querySelectorAll('[data-video]').forEach(b=>b.onclick=()=>showStatus('ვიდეოზარი ჯერ არ არის ჩართული'));
 document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>showModal('კონტაქტის წაშლა','ნამდვილად გინდა კონტაქტის წაშლა?',async()=>{await call('removeFriend',{targetId:b.dataset.remove});await loadPeople()}));
 document.querySelectorAll('[data-accept]').forEach(b=>b.onclick=async()=>{await call('respondFriend',{targetId:b.dataset.accept,decision:'accept'});await loadPeople()});
 document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=async()=>{await call('respondFriend',{targetId:b.dataset.reject,decision:'reject'});await loadPeople()});
}
async function openProfile(id){
 selectedPerson=people.find(x=>x.id===id)||contacts.find(x=>x.id===id);if(!selectedPerson)return;
 const yes=contacts.some(x=>x.id===id);
 $('profileName').textContent=selectedPerson.name;
 $('profileMore').hidden=!yes;$('profileMoreMenu').hidden=true;$('profileChatBox').hidden=true;$('profilePanel').classList.remove('chat-open');
 $('profilePanel').hidden=false;$('profilePanel').classList.remove('profileSlideOut','profileSlideIn');void $('profilePanel').offsetWidth;$('profilePanel').classList.add('profileSlideIn');$('profilePanel').scrollTop=0;
}
$('backUsers').onclick=()=>{const panel=$('profilePanel');panel.classList.remove('chat-open');panel.classList.remove('profileSlideIn');panel.classList.add('profileSlideOut');panel.addEventListener('animationend',()=>{panel.hidden=true;panel.classList.remove('profileSlideOut');selectedPerson=null;if(directPoll)clearInterval(directPoll)},{once:true})};
$('profileMore').onclick=()=>{$('profileMoreMenu').hidden=!$('profileMoreMenu').hidden};
document.addEventListener('click',e=>{if(!e.target.closest('.profileCallActions'))$('profileMoreMenu').hidden=true});

$('directSend').onclick=async()=>{const t=$('directText').value.trim();if(!t||!directTarget)return;try{const sent=await call('sendDirect',{targetId:directTarget,text:t});$('directText').value='';$('directText').style.height='';await loadDirect();try{const pr=await fetch('https://temo-ai.temo75elia.workers.dev',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'push-direct',userId:uid,targetId:directTarget,sessionToken:token,messageId:sent.message?.id||'',message:t,senderName:user})});const pd=await pr.json().catch(()=>({}));if(!pr.ok||!pd.ok||Number(pd.sent||0)<1)console.warn('Chat push delivery:',pr.status,pd)}catch(e){console.warn('Chat push failed',e)}}catch(e){showStatus(e.message)}};
$('directText').addEventListener('input',()=>{const el=$('directText');el.style.height='auto';el.style.height=Math.min(el.scrollHeight,window.innerHeight*.30)+'px'});
$('profileVideo').onclick=beginVideo;
let activeCall=null,pc=null,localStream=null,callPoll=null,incomingPoll=null,incomingCheckBusy=false,callSide='',seenCandidates=new Set(),remoteReady=false;
let ringAudio=null,ringOscillator=null,ringGain=null,ringTimer=null,ringPulse=false;
function unlockRingAudio(){
 try{
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextClass)return;
  if(!ringAudio)ringAudio=new AudioContextClass();
  if(ringAudio.state==='suspended')ringAudio.resume().catch(()=>{});
 }catch(e){console.warn('Ringtone audio:',e)}
}
['pointerdown','touchstart','click','keydown'].forEach(type=>document.addEventListener(type,unlockRingAudio,{passive:true}));
async function startRingtone(){
 try{
  unlockRingAudio();
  if(!ringAudio||ringOscillator)return;
  if(ringAudio.state==='suspended')await ringAudio.resume();
  if(ringAudio.state!=='running')return;
  ringOscillator=ringAudio.createOscillator();
  ringGain=ringAudio.createGain();
  ringOscillator.type='sine';
  ringOscillator.frequency.value=440;
  ringGain.gain.value=0;
  ringOscillator.connect(ringGain);ringGain.connect(ringAudio.destination);
  ringOscillator.start();
  const ringPattern=()=>{
   if(!ringGain||!ringAudio)return;
   const now=ringAudio.currentTime;
   ringGain.gain.cancelScheduledValues(now);
   ringGain.gain.setValueAtTime(0,now);
   ringGain.gain.setValueAtTime(0.18,now+0.03);
   ringGain.gain.setValueAtTime(0,now+0.28);
   ringGain.gain.setValueAtTime(0.18,now+0.48);
   ringGain.gain.setValueAtTime(0,now+0.78);
  };
  ringPattern();
  ringTimer=setInterval(ringPattern,1200);
 }catch(e){console.warn('Ringtone start:',e)}
}
function stopRingtone(){
 if(ringTimer){clearInterval(ringTimer);ringTimer=null}
 if(ringGain&&ringAudio)try{ringGain.gain.setTargetAtTime(0,ringAudio.currentTime,0.03)}catch(e){}
 if(ringOscillator){try{ringOscillator.stop()}catch(e){}try{ringOscillator.disconnect()}catch(e){}}
 ringOscillator=null;ringGain=null;ringPulse=false;
}
const videoBox=$('videoCall'),remoteVideo=$('remoteVideo'),localVideo=$('localVideo');
function showVideo(title){$('videoTitle').textContent=title;videoBox.classList.add('show')}
async function startMedia(){
 if(!navigator.mediaDevices?.getUserMedia)throw new Error('კამერა/მიკროფონი მიუწვდომელია. გახსენი საიტი HTTPS-ით.');
 localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
 localVideo.srcObject=localStream;
}
async function makePeer(){
 const turnResponse=await fetch('https://temo1-messenger-webrtc-test.temo75elia.workers.dev',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'turnCredentials',sessionToken:token})});
 const turnData=await turnResponse.json().catch(()=>({}));
 if(!turnResponse.ok||!Array.isArray(turnData.iceServers))throw new Error(turnData.error||'TURN სერვერი მიუწვდომელია');
 pc=new RTCPeerConnection({iceServers:[...turnData.iceServers,{urls:'stun:stun.l.google.com:19302'}]});
 localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
 pc.ontrack=e=>{if(e.streams&&e.streams[0])remoteVideo.srcObject=e.streams[0];else{if(!remoteVideo.srcObject)remoteVideo.srcObject=new MediaStream();remoteVideo.srcObject.addTrack(e.track)}remoteVideo.play().catch(()=>{});showStatus('მეორე მხარის ვიდეო მიღებულია')};
 pc.onicecandidate=e=>{if(e.candidate&&activeCall)call('callSet',{callId:activeCall.id,field:'candidate',value:e.candidate.toJSON()}).catch(()=>{})};
 pc.oniceconnectionstatechange=()=>{if(pc){console.log('ICE state:',pc.iceConnectionState);showStatus('ICE: '+pc.iceConnectionState)}};
 pc.onconnectionstatechange=()=>{if(pc){console.log('Peer state:',pc.connectionState);if(['failed','disconnected'].includes(pc.connectionState))showStatus('ვიდეოკავშირის პრობლემა: '+pc.connectionState)}};
}
async function stopVideo(end=true){
 stopRingtone();
 if(callPoll)clearInterval(callPoll);callPoll=null;
 if(end&&activeCall)call('callEnd',{callId:activeCall.id}).catch(()=>{});
 if(pc){pc.close();pc=null}
 if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}
 remoteVideo.srcObject=null;localVideo.srcObject=null;activeCall=null;callSide='';seenCandidates.clear();remoteReady=false;
 videoBox.classList.remove('show');$('videoAccept').hidden=true;
 startIncomingPolling();
}
async function sendOffer(){
 await makePeer();const offer=await pc.createOffer();await pc.setLocalDescription(offer);
 await call('callSet',{callId:activeCall.id,field:'offer',value:pc.localDescription.toJSON()});
}
async function acceptVideo(){
 if(!activeCall)return;
 stopRingtone();
 try{
  $('videoAccept').hidden=true;
  activeCall=await call('callGet',{callId:activeCall.id});
  if(!activeCall.offer){
   const callId=activeCall.id,deadline=Date.now()+60000;
   while(!activeCall.offer&&Date.now()<deadline){
    await new Promise(resolve=>setTimeout(resolve,300));
    activeCall=await call('callGet',{callId});
    if(activeCall.status==='ended')throw new Error('ზარი დასრულდა');
   }
  }
  if(!activeCall.offer)throw new Error('ზარის კავშირი ვერ დამყარდა. სცადეთ ხელახლა.');
  await startMedia();await makePeer();
  await pc.setRemoteDescription(activeCall.offer);remoteReady=true;
  const answer=await pc.createAnswer();await pc.setLocalDescription(answer);
  await call('callSet',{callId:activeCall.id,field:'answer',value:pc.localDescription.toJSON()});
  callSide='callee';showVideo('ვიდეოზარი — '+(activeCall.callerName||'მომხმარებელი'));
  startCallPolling();
 }catch(e){showStatus(e.message||'ზარზე პასუხი ვერ მოხერხდა');await stopVideo()}
}
async function beginVideo(){
 if(!selectedPerson||!contacts.some(x=>x.id===selectedPerson.id))return;
 showVideo('კამერას ვრთავ...');
 try{
  await startMedia();activeCall=await call('callCreate',{targetId:selectedPerson.id});callSide='caller';
  try{const pr=await fetch('https://temo-ai.temo75elia.workers.dev',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'push-video-call',userId:uid,targetId:selectedPerson.id,callId:activeCall.id,sessionToken:token,callerName:user})});const pd=await pr.json().catch(()=>({}));if(!pr.ok||!pd.ok||Number(pd.sent||0)<1)console.warn('Video call Push:',pr.status,pd)}catch(pushError){console.warn('Video call Push failed:',pushError)}
  showVideo('ვურეკავ: '+selectedPerson.name);await sendOffer();startCallPolling();
 }catch(e){showStatus(e.message||'ვიდეოზარი ვერ დაიწყო');await stopVideo()}
}
async function syncCandidates(data,side){
 if(!remoteReady||!pc)return;
 const entries=data?.candidates?.[side]||{};
 for(const [id,c] of Object.entries(entries)){
  if(seenCandidates.has(id))continue;
  try{await pc.addIceCandidate(c);seenCandidates.add(id)}catch(e){console.warn('ICE candidate',e)}
 }
}
function startCallPolling(){
 if(callPoll)clearInterval(callPoll);
 callPoll=setInterval(async()=>{
  if(!activeCall||!pc)return;
  try{
   const c=await call('callGet',{callId:activeCall.id});
   if(c.status==='ended'){showStatus('ზარი დასრულდა');await stopVideo(false);return}
   if(callSide==='caller'&&c.answer&&!remoteReady){await pc.setRemoteDescription(c.answer);remoteReady=true}
   await syncCandidates(c,callSide==='caller'?'callee':'caller');
  }catch(e){console.warn('Call sync',e)}
 },900);
}
async function checkIncoming(){
 if(incomingCheckBusy||activeCall||videoBox.classList.contains('show')||document.visibilityState==='hidden')return;
 incomingCheckBusy=true;
 try{
  const response=await call('callIncoming');
  const calls=Array.isArray(response)?response:Array.isArray(response?.calls)?response.calls:Array.isArray(response?.incomingCalls)?response.incomingCalls:Array.isArray(response?.data?.calls)?response.data.calls:response?.call?[response.call]:[];
  if(calls.length){
   activeCall=calls[0];callSide='callee';showVideo('შემომავალი ზარი: '+(activeCall.callerName||activeCall.fromName||'მომხმარებელი'));
   $('videoAccept').hidden=false;startRingtone();
  }
 }catch(e){console.warn('Incoming call check:',e)}
 finally{incomingCheckBusy=false}
}
function startIncomingPolling(){
 if(incomingPoll)clearInterval(incomingPoll);
 checkIncoming();incomingPoll=setInterval(checkIncoming,1000);
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!activeCall)checkIncoming()});
$('videoAccept').onclick=acceptVideo;
$('videoHangup').onclick=()=>stopVideo(true);
$('videoMute').onclick=()=>{if(localStream){const t=localStream.getAudioTracks()[0];if(t){t.enabled=!t.enabled;$('videoMute').textContent=t.enabled?'🎙️':'🔇'}}};
$('videoCamera').onclick=()=>{if(localStream){const t=localStream.getVideoTracks()[0];if(t){t.enabled=!t.enabled;$('videoCamera').textContent=t.enabled?'📷':'🚫'}}};
startIncomingPolling();
if(location.origin==='https://temo1.gr'){
 ensureMessengerPush().catch(e=>console.warn('Messenger Push registration:',e));
}


$('profileRemove').onclick=()=>{if(!selectedPerson)return;showModal('კონტაქტის წაშლა','ნამდვილად გინდა კონტაქტიდან წაშლა?',async()=>{await call('removeFriend',{targetId:selectedPerson.id});await loadPeople();$('profilePanel').hidden=true})};
$('profileBlock').onclick=async()=>{if(!selectedPerson)return;try{await call('block',{targetId:selectedPerson.id});showStatus('მომხმარებელი დაიბლოკა');$('profilePanel').hidden=true}catch(e){showStatus(e.message)}};
async function openDirect(id){await openProfile(id);if(contacts.some(x=>x.id===id)){directTarget=id;$('profilePanel').classList.add('chat-open');$('profileChatBox').hidden=false;await loadDirect();if(directPoll)clearInterval(directPoll);directPoll=setInterval(()=>loadDirect().catch(()=>{}),3000)}}
function syncKeyboardViewport(){
 const panel=$('profilePanel'),vv=window.visualViewport;
 if(!panel||panel.hidden)return;
 const focused=document.activeElement===$('directText');
 if(focused&&vv){
  panel.style.top=vv.offsetTop+'px';
  panel.style.height=vv.height+'px';
  panel.style.bottom='auto';
 }else{
  panel.style.top='0px';panel.style.height='100dvh';panel.style.bottom='auto';
 }
}
if(window.visualViewport){
 window.visualViewport.addEventListener('resize',syncKeyboardViewport);
 window.visualViewport.addEventListener('scroll',syncKeyboardViewport);
}
$('directText').addEventListener('focus',()=>setTimeout(syncKeyboardViewport,80));
$('directText').addEventListener('blur',()=>setTimeout(syncKeyboardViewport,100));


async function loadDirect(){if(!directTarget)return;const list=await call('directMessages',{targetId:directTarget});const log=$('directLog');if(!log||$('profileChatBox').hidden)return;log.innerHTML=list.map(m=>'<div class="msg '+(m.userId===uid?'mine':'')+'" data-message-id="'+esc(m.id||'')+'" data-message-text="'+esc(m.text)+'"><small>'+esc(m.userName)+'</small><div>'+esc(m.text)+'</div></div>').join('');log.scrollTop=log.scrollHeight}
let messageActionPopup=null;function closeMessageActionPopup(){if(messageActionPopup){messageActionPopup.remove();messageActionPopup=null}document.removeEventListener('pointerdown',outsideMessageActionPopup,true)}function outsideMessageActionPopup(e){if(messageActionPopup&&!messageActionPopup.contains(e.target))closeMessageActionPopup()}function messageActions(el){if(!el||!el.classList.contains('mine'))return;const messageId=el.dataset.messageId;if(!messageId)return;closeMessageActionPopup();const popup=document.createElement('div');popup.className='messageActionPopup';popup.innerHTML='<button type="button" id="editOwnMessage" aria-label="შესწორება" title="შესწორება"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 16.5-.8 4.3 4.3-.8L20 7.5 16.5 4 4 16.5Z"/><path d="m14.8 5.7 3.5 3.5"/></svg></button><button type="button" id="deleteOwnMessage" aria-label="წაშლა" title="წაშლა"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6m4-6v6M5 7l1 14h12l1-14M9 7V4h6v3"/></svg></button>';document.body.appendChild(popup);messageActionPopup=popup;const rect=el.getBoundingClientRect();const width=popup.offsetWidth,height=popup.offsetHeight;popup.style.left=Math.max(8,Math.min(innerWidth-width-8,rect.left+(rect.width-width)/2))+'px';popup.style.top=Math.max(8,rect.top-height-9)+'px';$('editOwnMessage').onclick=()=>{closeMessageActionPopup();const current=el.dataset.messageText||'';showModal('შეტყობინების შესწორება','<textarea id="editMessageText" maxlength="2000" style="width:100%;min-height:100px;box-sizing:border-box">'+esc(current)+'</textarea>',async()=>{const text=$('editMessageText').value.trim();if(!text)throw new Error('ტექსტი ცარიელია');await call('editDirect',{targetId:directTarget,messageId,text});await loadDirect()})};$('deleteOwnMessage').onclick=()=>{closeMessageActionPopup();showModal('შეტყობინების წაშლა','ნამდვილად გინდა ამ ტექსტის წაშლა?',async()=>{await call('deleteDirect',{targetId:directTarget,messageId});await loadDirect()})};setTimeout(()=>document.addEventListener('pointerdown',outsideMessageActionPopup,true),0)}
const directLog=$('directLog');let pressTimer=null,pressStart=null,lastLongPressAt=0;function clearMessagePress(){if(pressTimer)clearTimeout(pressTimer);pressTimer=null;pressStart=null}directLog.addEventListener('pointerdown',e=>{if(e.button!==0)return;const el=e.target.closest('.msg.mine');if(!el)return;clearMessagePress();pressStart={x:e.clientX,y:e.clientY};pressTimer=setTimeout(()=>{pressTimer=null;lastLongPressAt=Date.now();messageActions(el)},600)});directLog.addEventListener('pointermove',e=>{if(!pressStart)return;if(Math.hypot(e.clientX-pressStart.x,e.clientY-pressStart.y)>14)clearMessagePress()},{passive:true});['pointerup','pointercancel','pointerleave'].forEach(type=>directLog.addEventListener(type,clearMessagePress,{passive:true}));directLog.addEventListener('contextmenu',e=>{const el=e.target.closest('.msg.mine');if(el){e.preventDefault();if(Date.now()-lastLongPressAt>900)messageActions(el)}});
async function init(){if(!user||!uid||!token){showStatus('ჯერ TEMO1.gr-ზე შედი.');return}try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'session',sessionToken:token})});if(!r.ok)throw new Error('სესია ვადაგასულია. შედი თავიდან TEMO1.gr-ზე.');$('userName').textContent=user;$('app').hidden=false;showStatus('');try{await loadPeople()}catch(e){showStatus('მომხმარებლების სია ვერ ჩაიტვირთა. საჭიროა Cloudflare Worker-ის განახლება.')}}catch(e){$('app').hidden=false;$('userName').textContent=user;showStatus(e.message||'კავშირის შეცდომა')}}
init();
setInterval(()=>loadPeople().catch(()=>{}),5000);
})();
