h2{font-size:16px;margin:0 0 12px}.createRow{display:flex;gap:7px;margin-bottom:9px}.createRow input{flex:1}.groupList{display:grid;gap:7px}.groupItem{width:100%;text-align:left;background:#0a1821;border-color:#203b4b}.groupItem.active{border-color:#2999df;box-shadow:0 0 8px #2999df66}.muted{color:var(--muted);font-size:13px}.chat{display:flex;flex-direction:column;min-height:65vh}.memberList{display:flex;gap:6px;overflow-x:auto;padding:9px 0;border-bottom:1px solid var(--line)}.memberChip{display:flex;align-items:center;gap:6px;white-space:nowrap;background:#0a1821;border:1px solid #29404c;border-radius:20px;padding:5px 8px;font-size:12px}.memberChip button{padding:4px 7px;font-size:11px}.personRow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0a1821;border:1px solid #203b4b;border-radius:12px;padding:10px;min-width:0}.personName{border:0;background:transparent;text-align:left;padding:6px 0;font-size:15px;font-weight:700;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.personActions{display:flex;gap:6px;flex-shrink:0}.personActions button{padding:8px 10px;font-size:11px}.presenceDot{display:inline-block;width:8px;height:8px;min-width:8px;border-radius:50%;margin-left:-4px;margin-right:-4px;margin-top:0;align-self:flex-start;background:#66737b;vertical-align:middle}.presenceDot.online{background:#20df70;box-shadow:0 0 7px #20df70,0 0 13px #20df7077}
.personName{font-size:20px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.personActions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;flex-shrink:0}.personActions button{padding:7px 5px;font-size:11px;border-radius:8px;white-space:nowrap;min-width:0}.personActions button:disabled{opacity:.55}.personActions button.videoAction,.personActions button.chatAction{width:54px;height:42px;min-width:54px;padding:0;border-radius:13px;display:grid;place-items:center;background:#12364a;border:1px solid #285269;box-shadow:inset 0 0 0 1px #ffffff08}.personActions button.videoAction svg,.personActions button.chatAction svg{width:25px;height:25px;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.8}.personActions button.videoAction svg{stroke:#54d8ff}.personActions button.chatAction svg{stroke:#fff}.personActions button.videoAction:active,.personActions button.chatAction:active{transform:scale(.96)}.requestRow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}#contacts,#allUsers{display:grid;grid-template-columns:1fr;gap:8px}#incomingRequests{margin-bottom:10px}#allUsers>.muted,#contacts>.muted{padding:4px 2px;font-weight:700;color:#b8cbd3}.chatHead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line)}.messages{flex:1;min-height:280px;max-height:58vh;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:12px 2px;display:flex;flex-direction:column;gap:9px}#profilePanel.chat-open{overflow:hidden}#profilePanel.chat-open #profileChatBox{min-height:0}.msg{max-width:88%;align-self:flex-start;box-sizing:border-box;background:transparent;border:1.5px solid #e51d35;border-radius:18px;padding:7px 12px;overflow-wrap:anywhere;text-align:left}.msg.mine{align-self:flex-end;text-align:right;border-color:#08bce9} ze:22px}.profileCallActions>#profileVideo{order:0}.profileCallActions>#profileMore{order:1}.profileCallActions #profileMoreMenu{position:absolute;right:0;top:48px;z-index:8;min-width:132px;padding:7px;background:#102b3b;border:1px solid #285269;border-radius:12px;box-shadow:0 8px 24px #0008;display:flex;flex-direction:column;gap:6px}.profileCallActions #profileMoreMenu[hidden]{display:none}.profileCallActions #profileMoreMenu button{width:100%;text-align:left;padding:9px 11px;border-radius:8px;font-size:14px}.status:empty{display:none}.status{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:70;padding:9px 16px;text-align:center;color:var(--muted);background:#10232fee;border:1px solid #285269;border-radius:12px;box-shadow:0 4px 14px #0006;pointer-events:none;white-space:nowrap}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.modal.show{display:flex}.modalBox{width:min(280px,100%);background:#10232f;border:1px solid #285269;border-radius:10px;padding:9px}.modalBox h2{font-size:14px;margin:0 0 6px}.modalBox input{margin:6px 0}.modalBox #modalBody{font-size:13px}.modalActions{display:flex;gap:5px}.modalActions button{flex:1;padding:6px 8px;font-size:12px;border-radius:7px}
#modal:has(#editOwnMessage) .modalBox{width:min(210px,calc(100% - 40px));padding:8px;border-radius:12px}#modal:has(#editOwnMessage) #modalTitle,#modal:has(#editOwnMessage) .modalActions{display:none!important}#modal:has(#editOwnMessage) #modalBody{margin:0}.messageActionPopup{position:fixed;z-index:1000;display:flex;flex-direction:row;align-items:center;gap:7px;padding:6px 8px;background:#0b1b25;border:1px solid #8da5b1;border-radius:15px;box-shadow:0 5px 16px #0009}.messageActionPopup:after{content:'';position:absolute;left:50%;margin-left:-7px;bottom:-8px;width:13px;height:13px;background:#0b1b25;border-right:1px solid #8da5b1;border-bottom:1px solid #8da5b1;transform:rotate(45deg)}.messageActionPopup button{width:38px;height:36px;display:grid;place-items:center;padding:0;border-radius:10px;background:#102b3b;color:#eef7f7;box-shadow:none;text-shadow:none}.messageActionPopup button svg{width:19px;height:19px;display:block}.messageActionPopup #editOwnMessage{border:1.5px solid #08bce9;color:#dff8ff}.messageActionPopup #deleteOwnMessage{border:1.5px solid #e51d35;color:#ffdfe3}

@media(max-width:680px){
 .app{padding:12px 15px 30px}

<style>

<div class="app" id="app" hidden>

 <div id="profileChatBox" hidden style="margin-top:14px"><div class="messages" id="directLog" style="min-height:0;max-height:none"></div><div class="sendRow"><input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden><button type="button" id="photoPick" title="ფოტოს გაგზავნა" aria-label="ფოტოს გაგზავნა"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#55cfff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 15-5-5L5 20"/></svg></button><button type="button" id="voiceRecord" title="ხმოვანი ჩაწერა" aria-label="ხმოვანი ჩაწერა"><svg viewBox="0 0 24 24" width="23" height="23" aria-hidden="true" fill="none" stroke="#55cfff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5.5 10.5v1a6.5 6.5 0 0 0 13 0v-1M12 18v3.5M8.5 21.5h7"/></svg></button><textarea id="directText" rows="2" maxlength="2000" placeholder="შეტყობინება..." enterkeyhint="enter"></textarea><button class="primary" id="directSend" aria-label="გაგზავნა" title="გაგზავნა"><svg viewBox="0 0 24 24" width="27" height="27" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4 20-7Z"/></svg></button></div><div id="voiceStatus" class="muted" style="padding-top:5px"></div></div>

</div>

</div>

async function ensureMessengerPush(){
 if(location.origin!=='https://temo1.gr'||Notification.permission!=='granted'||!('serviceWorker'in navigator)||!('PushManager'in window))return;
 const me=localStorage.getItem('temoWorkTrackerUserId')||uid;
 const session=getToken();
 if(!me||!session)return;
 const worker='https://temo-ai.temo75elia.workers.dev';
 const cfg=await fetch(worker+'?action=push-config',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Push config HTTP '+r.status);return r.json()});
 if(!cfg.ok||!cfg.publicKey)throw Error(cfg.error||'Push key unavailable');
 const s=cfg.publicKey.replace(/-/g,'+').replace(/_/g,'/');
 const raw=atob(s+'='.repeat((4-s.length%4)%4)),key=new Uint8Array(raw.length);
 for(let i=0;i<raw.length;i++)key[i]=raw.charCodeAt(i);
 await navigator.serviceWorker.register('/temo-notes-sw.js',{scope:'/'});
 const reg=await navigator.serviceWorker.ready;
 let sub=await reg.pushManager.getSubscription();
 if(sub){const old=sub.options?.applicationServerKey;if(old&& (old.byteLength!==key.length||!key.every((v,i)=>v===new Uint8Array(old)[i]))){await sub.unsubscribe();sub=null;}}
 if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});
 const deviceKey='temoPushDeviceId';let deviceId=localStorage.getItem(deviceKey);
 if(!deviceId){deviceId=crypto.randomUUID?crypto.randomUUID():'d_'+Date.now();localStorage.setItem(deviceKey,deviceId);}
 const response=await fetch(worker,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'push-subscribe',userId:me,sessionToken:session,deviceId,platform:/Android/i.test(navigator.userAgent)?'android-native':'web-push',subscription:sub.toJSON()})});
 const result=await response.json().catch(()=>({}));
 if(!response.ok||!result.ok)throw Error(result.error||('Push subscribe HTTP '+response.status));
}

async function beginVoiceHold(){
 if(voiceStarting||voiceRecorder||pendingVoice)return;
 voiceHoldActive=true;voiceReleasePending=false;voiceStarting=true;
 try{
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('ამ ბრაუზერში ხმოვანი ჩაწერა მიუწვდომელია');

  voiceRecorder.onstop=()=>{
   stream.getTracks().forEach(t=>t.stop());

 }catch(e){voiceHoldActive=false;setVoiceWave(false);voiceButton.innerHTML='<svg viewBox="0 0 24 24" width="23" height="23" aria-hidden="true" fill="none" stroke="#55cfff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5.5 10.5v1a6.5 6.5 0 0 0 13 0v-1M12 18v3.5M8.5 21.5h7"/></svg>';$('voiceStatus').textContent=e.message||'მიკროფონის შეცდომა'}

async function convertVoiceToWav(blob){
 const AudioCtx=window.AudioContext||window.webkitAudioContext;
 if(!AudioCtx)throw new Error('აუდიოს ფორმატის გარდაქმნა მიუწვდომელია');
 const ctx=new AudioCtx();
 try{
  const decoded=await ctx.decodeAudioData(await blob.arrayBuffer());
  const sourceRate=decoded.sampleRate,targetRate=16000;
  const length=Math.ceil(decoded.duration*targetRate);
  const samples=new Float32Array(length);
  for(let i=0;i<length;i++){
   const pos=i*sourceRate/targetRate,index=Math.floor(pos),frac=pos-index;
   let value=0;
   for(let ch=0;ch<decoded.numberOfChannels;ch++){
    const data=decoded.getChannelData(ch);
    const a=data[index]||0,b=data[Math.min(index+1,data.length-1)]||0;
    value+=(a+(b-a)*frac)/decoded.numberOfChannels;
   }
   samples[i]=Math.max(-1,Math.min(1,value));
  }
  const wav=new ArrayBuffer(44+samples.length*2),view=new DataView(wav);
  const write=(offset,str)=>{for(let i=0;i<str.length;i++)view.setUint8(offset+i,str.charCodeAt(i))};
  write(0,'RIFF');view.setUint32(4,36+samples.length*2,true);write(8,'WAVE');write(12,'fmt ');
  view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);
  view.setUint32(24,targetRate,true);view.setUint32(28,targetRate*2,true);
  view.setUint16(32,2,true);view.setUint16(34,16,true);write(36,'data');
  view.setUint32(40,samples.length*2,true);
  for(let i=0;i<samples.length;i++)view.setInt16(44+i*2,samples[i]<0?samples[i]*32768:samples[i]*32767,true);
  return new Blob([wav],{type:'audio/wav'});
 }finally{await ctx.close().catch(()=>{})}
}

 while((match=urlPattern.exec(text))){
  let raw=match[0],url=raw;
  while(/[),.!?;:}\]]$/.test(url))url=url.slice(0,-1);
  if(!url)continue;
  out+=esc(text.slice(last,match.index));
  const href=/^https?:\/\//i.test(url)?url:'https://'+url;
  out+='<a href="'+esc(href)+'" target="_blank" rel="noopener noreferrer">'+esc(url)+'</a>';
  out+=esc(raw.slice(url.length));last=match.index+raw.length;

}

const imageObjectUrls=new Map();
function imageMarkup(value){const m=String(value||'').match(IMAGE_RE);if(!m)return null;const stamp=Number(m[1].replace(/^img_/,'').split('_',1)[0]);if(!Number.isFinite(stamp)||Date.now()-stamp>=172800000)return '<div class="muted">ფოტოს შენახვის ვადა ამოიწურა</div>';let mime='image/jpeg';try{mime=decodeURIComponent(m[2])}catch{}return '<img class="chatImage" data-image-id="'+esc(m[1])+'" data-image-type="'+esc(mime)+'" alt="ფოტო იტვირთება" loading="lazy">'}
async function loadDirect(){if(!directTarget)return;const list=await call('directMessages',{targetId:directTarget});const log=$('directLog');if(!log||$('profileChatBox').hidden)return;const previousTop=log.scrollTop;const wasAtBottom=log.scrollHeight-log.clientHeight-previousTop<48;log.innerHTML=list.map(m=>{const voice=voiceMarkup(m.text),photo=imageMarkup(m.text);return '<div class="msg '+(m.userId===uid?'mine':'')+'" data-message-id="'+esc(m.id||'')+'" data-message-text="'+esc(m.text)+'"><small>'+esc(m.userName)+'</small><div>'+(voice||photo||linkifyMessage(m.text))+'</div></div>'}).join('');log.querySelectorAll('img.chatImage').forEach(async img=>{const id=img.dataset.imageId;try{let src=imageObjectUrls.get(id);if(!src){const r=await fetch(VOICE_API+'/image/'+encodeURIComponent(id)+'?type='+encodeURIComponent(img.dataset.imageType||'image/jpeg'),{headers:{'X-Session-Token':getToken()}});if(!r.ok)throw Error('expired');src=URL.createObjectURL(await r.blob());imageObjectUrls.set(id,src)}img.src=src;img.alt='ფოტო';img.onclick=()=>window.open(src,'_blank','noopener')}catch{img.alt='ფოტოს ვადა ამოიწურა ან ვერ ჩაიტვირთა';img.style.cursor='default'}});log.scrollTop=wasAtBottom?log.scrollHeight:previousTop}
let messageActionPopup=null;function closeMessageActionPopup(){if(messageActionPopup){messageActionPopup.remove();messageActionPopup=null}document.removeEventListener('pointerdown',outsideMessageActionPopup,true)}function outsideMessageActionPopup(e){if(messageActionPopup&&!messageActionPopup.contains(e.target))closeMessageActionPopup()}function messageActions(el){if(!el||!el.classList.contains('mine'))return;const messageId=el.dataset.messageId;if(!messageId)return;closeMessageActionPopup();const popup=document.createElement('div');popup.className='messageActionPopup';popup.innerHTML='<button type="button" id="editOwnMessage" aria-label="შესწორება" title="შესწორება"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 16.5-.8 4.3 4.3-.8L20 7.5 16.5 4 4 16.5Z"/><path d="m14.8 5.7 3.5 3.5"/></svg></button><button type="button" id="deleteOwnMessage" aria-label="წაშლა" title="წაშლა"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6m4-6v6M5 7l1 14h12l1-14M9 7V4h6v3"/></svg></button>';document.body.appendChild(popup);messageActionPopup=popup;const rect=el.getBoundingClientRect();const width=popup.offsetWidth,height=popup.offsetHeight;popup.style.left=Math.max(8,Math.min(innerWidth-width-8,rect.left+(rect.width-width)/2))+'px';popup.style.top=Math.max(8,rect.top-height-9)+'px';$('editOwnMessage').onclick=()=>{closeMessageActionPopup();const current=el.dataset.messageText||'';showModal('შეტყობინების შესწორება','<textarea id="editMessageText" maxlength="2000" style="width:100%;min-height:100px;box-sizing:border-box">'+esc(current)+'</textarea>',async()=>{const text=$('editMessageText').value.trim();if(!text)throw new Error('ტექსტი ცარიელია');await call('editDirect',{targetId:directTarget,messageId,text});await loadDirect()})};$('deleteOwnMessage').onclick=()=>{closeMessageActionPopup();showModal('შეტყობინების წაშლა','ნამდვილად გინდა ამ ტექსტის წაშლა?',async()=>{await call('deleteDirect',{targetId:directTarget,messageId});await loadDirect()})};setTimeout(()=>document.addEventListener('pointerdown',outsideMessageActionPopup,true),0)}
const directLog=$('directLog');let pressTimer=null,pressStart=null,lastLongPressAt=0;function clearMessagePress(){if(pressTimer)clearTimeout(pressTimer);pressTimer=null;pressStart=null}directLog.addEventListener('pointerdown',e=>{if(e.button!==0)return;const el=e.target.closest('.msg.mine');if(!el)return;clearMessagePress();pressStart={x:e.clientX,y:e.clientY};pressTimer=setTimeout(()=>{pressTimer=null;lastLongPressAt=Date.now();messageActions(el)},600)});directLog.addEventListener('pointermove',e=>{if(!pressStart)return;if(Math.hypot(e.clientX-pressStart.x,e.clientY-pressStart.y)>14)clearMessagePress()},{passive:true});['pointerup','pointercancel','pointerleave'].forEach(type=>directLog.addEventListener(type,clearMessagePress,{passive:true}));directLog.addEventListener('contextmenu',e=>{const el=e.target.closest('.msg.mine');if(el){e.preventDefault();if(Date.now()-lastLongPressAt>900)messageActions(el)}});
let validatedToken='';let validating=false;async function init(){const activeToken=getToken();if(!user||!uid||!activeToken){showStatus('ჯერ TEMO1.gr-ზე შედი.');return}if(validating)return;validating=true;try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'session',sessionToken:activeToken})});if(!r.ok)throw new Error('სესია ვადაგასულია. TEMO1.gr-ზე თავიდან შედი.');validatedToken=activeToken;$('userName').textContent=user;$('app').hidden=false;showStatus('');try{await loadPeople();const chatId=new URLSearchParams(location.search).get('chat');if(chatId&&contacts.some(c=>String(c.id)===String(chatId))){history.replaceState(null,'',location.pathname);await openDirect(chatId)}}catch(e){showStatus('მომხმარებლების სია ვერ ჩაიტვირთა. საჭიროა Cloudflare Worker-ის განახლება.')}}catch(e){$('app').hidden=false;$('userName').textContent=user;showStatus(e.message||'კავშირის შეცდომა')}finally{validating=false}}
init();
async function setMyPresence(online){if(!uid||!getToken())return;try{if(online)await call('presence',{mode:'beat'})}catch(e){}}
setMyPresence(true);
setInterval(()=>{if(!document.hidden)setMyPresence(true)},15000);
document.addEventListener('visibilitychange',()=>setMyPresence(!document.hidden));
window.addEventListener('pagehide',()=>{if(uid&&getToken())fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'messenger',op:'presence',online:false,sessionToken:getToken()}),keepalive:true}).catch(()=>{})});
window.addEventListener('focus',()=>{const latest=getToken();if(latest&&latest!==validatedToken)init()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const latest=getToken();if(latest&&latest!==validatedToken)init()}});
setInterval(()=>loadPeople().catch(()=>{}),5000);
})();
</script>
