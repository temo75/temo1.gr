<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071117">
<title>TEMO Messenger</title>
<style>
:root{color-scheme:dark;--bg:#071117;--panel:#0d1b24;--panel2:#10232f;--line:#1e3542;--blue:#2999df;--text:#eef7f7;--muted:#9fb0b8}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#061015,#0b1c27);color:var(--text);font-family:Arial,sans-serif;min-height:100vh}
.app{max-width:900px;margin:auto;padding:12px 12px 30px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px 16px;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:800}.brand span{color:var(--blue)}.user{font-size:13px;color:var(--muted);text-align:right}
button,input{font:inherit}button{border:1px solid #285269;border-radius:10px;padding:10px 13px;background:#183445;color:white;font-weight:700;cursor:pointer}button.primary{background:#126ba0;border-color:#2999df}button.danger{background:#4a2228;border-color:#74333d}input{width:100%;padding:12px;border:1px solid #29404c;border-radius:10px;background:#071117;color:white;min-width:0}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:14px}.panel{border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,var(--panel),var(--panel2));padding:14px;min-width:0}
h2{font-size:16px;margin:0 0 12px}.createRow{display:flex;gap:7px;margin-bottom:9px}.createRow input{flex:1}.groupList{display:grid;gap:7px}.groupItem{width:100%;text-align:left;background:#0a1821;border-color:#203b4b}.groupItem.active{border-color:#2999df;box-shadow:0 0 8px #2999df66}.muted{color:var(--muted);font-size:13px}.chat{display:flex;flex-direction:column;min-height:65vh}.memberList{display:flex;gap:6px;overflow-x:auto;padding:9px 0;border-bottom:1px solid var(--line)}.memberChip{display:flex;align-items:center;gap:6px;white-space:nowrap;background:#0a1821;border:1px solid #29404c;border-radius:20px;padding:5px 8px;font-size:12px}.memberChip button{padding:4px 7px;font-size:11px}.personRow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0a1821;border:1px solid #203b4b;border-radius:12px;padding:10px;min-width:0}.personName{border:0;background:transparent;text-align:left;padding:6px 0;font-size:15px;font-weight:700;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.personActions{display:flex;gap:6px;flex-shrink:0}.personActions button{padding:8px 10px;font-size:11px}.personName{font-size:14px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.personActions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;flex-shrink:0}.personActions button{padding:7px 5px;font-size:11px;border-radius:8px;white-space:nowrap;min-width:0}.personActions button:disabled{opacity:.55}.requestRow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}#contacts,#allUsers{display:grid;grid-template-columns:1fr;gap:8px}#incomingRequests{margin-bottom:10px}#allUsers>.muted,#contacts>.muted{padding:4px 2px;font-weight:700;color:#b8cbd3}.chatHead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line)}.messages{flex:1;min-height:280px;max-height:58vh;overflow:auto;padding:12px 2px;display:flex;flex-direction:column;gap:9px}.msg{max-width:88%;align-self:flex-start;background:#102b3b;border:1px solid #23495f;border-radius:13px;padding:9px 11px;overflow-wrap:anywhere}.msg.mine{align-self:flex-end;background:#123d58}.msg small{display:block;color:#9fb0b8;font-size:11px;margin-bottom:4px}.sendRow{display:flex;gap:7px}.sendRow input{flex:1}.empty{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);gap:10px}.bubble{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;background:#102b3b;border:1px solid #285269;font-size:28px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}.tools button{width:42px;height:42px;min-width:42px;padding:0;border-radius:11px;display:grid;place-items:center;font-size:19px;line-height:1}.tools button#profileRemove,.tools button#profileBlock{font-size:17px}.profileHead{display:flex;align-items:center;gap:10px;margin:10px 0}.profileHead .bubble{width:42px;height:42px;min-width:42px;border-radius:13px;font-size:21px}.profileHead h2{font-size:16px}.status{padding:18px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modal.show{display:flex}.modalBox{width:min(390px,100%);background:#10232f;border:1px solid #285269;border-radius:16px;padding:18px}.modalBox input{margin:10px 0}.modalActions{display:flex;gap:8px}.modalActions button{flex:1}
@media(max-width:680px){.layout{grid-template-columns:1fr}.chat{min-height:58vh}.messages{max-height:48vh;min-height:220px}.groupList{grid-template-columns:1fr}.groupItem{font-size:13px;padding:10px}.app{padding:8px 8px 20px}.personRow{flex-direction:row;align-items:center;gap:8px;padding:9px}.personName{font-size:14px}.personActions{width:auto;display:flex;gap:5px}.personActions button{font-size:11px;padding:8px 9px}.panel{padding:12px}}
</style>
</head>
<body>
<div class="app" id="app" hidden>
<header><div class="brand">TEMO <span>MESSENGER</span></div><div class="user" id="userName"></div></header>
<div class="layout">
<section class="panel" style="margin-top:14px"><h2>მომხმარებლები</h2><div id="incomingRequests" class="muted"></div><div id="contacts" class="groupList" style="margin-bottom:12px"></div><div id="allUsers" class="groupList"></div></section>
<section class="panel" id="profilePanel" hidden style="margin-top:12px">
 <button id="backUsers">← უკან</button>
 <div class="profileHead"><div class="bubble">👤</div><div><h2 id="profileName" style="margin:0 0 4px"></h2><div class="muted" id="profileState"></div></div></div>
 <div class="tools"><button id="profileChat" class="primary" title="ჩატის გახსნა" aria-label="ჩატის გახსნა">💬</button><button id="profileVideo" title="ვიდეოზარი" aria-label="ვიდეოზარი">📹</button><button id="profileRemove" class="danger" title="კონტაქტიდან წაშლა" aria-label="კონტაქტიდან წაშლა">🗑️</button><button id="profileBlock" class="danger" title="დაბლოკვა" aria-label="დაბლოკვა">🚫</button></div>
 <div id="profileChatBox" hidden style="margin-top:14px"><div class="messages" id="directLog" style="min-height:220px;max-height:48vh"></div><div class="sendRow"><input id="directText" maxlength="2000" placeholder="შეტყობინება..."><button class="primary" id="directSend">გაგზავნა</button></div></div>
</section>

</div>
<div class="status" id="status">მოწმდება შესვლა...</div>
</div>
<div class="modal" id="modal"><div class="modalBox"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="modalActions"><button id="modalCancel">დახურვა</button><button class="primary" id="modalOk">კარგი</button></div></div></div>
<script>
(()=>{
const API='https://temo1-firebase-bridge.temo75elia.workers.dev',user=localStorage.getItem('temoWorkTrackerUser')||'',uid=localStorage.getItem('temoWorkTrackerUserId')||'',token=localStorage.getItem('temoFirebaseBridgeSession')||'';
const $=id=>document.getElementById(id);let modalAction=null;
const call=async(op,data={})=>{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'messenger',op,...data,sessionToken:token})});const j=await r.json();if(!r.ok)throw new Error(j.error||'შეცდომა');return j};
const showModal=(title,html,fn)=>{$('modalTitle').textContent=title;$('modalBody').innerHTML=html;modalAction=fn;$('modal').classList.add('show')};
const closeModal=()=>{$('modal').classList.remove('show');modalAction=null};
$('modalCancel').onclick=closeModal;$('modalOk').onclick=async()=>{if(modalAction)await modalAction();closeModal()};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showStatus(t){$('status').textContent=t}
let people=[],contacts=[],requests=[],directTarget=null,directPoll=null,selectedPerson=null;
function personRow(u){const yes=contacts.some(c=>c.id===u.id);return '<div class="personRow"><button class="personName" data-profile="'+esc(u.id)+'">'+esc(u.name)+'</button><span class="personActions">'+(yes?'<button disabled>✓</button>':'<button data-add="'+esc(u.id)+'">＋ დამატება</button>')+'</span></div>'}
async function loadPeople(){
 [people,contacts,requests]=await Promise.all([call('users'),call('contacts'),call('requests')]);
 $('contacts').innerHTML=contacts.length?'<div class="muted">ჩემი კონტაქტები</div>'+contacts.map(personRow).join(''):'<div class="muted">კონტაქტები ჯერ არ არის</div>';
 $('allUsers').innerHTML='<div class="muted">რეგისტრირებული მომხმარებლები</div>'+people.map(personRow).join('');
 $('incomingRequests').innerHTML=requests.length?'<b>მეგობრობის მოთხოვნები</b>'+requests.map(r=>'<div class="requestRow"><span>'+esc(r.name)+'</span><span class="personActions"><button data-accept="'+esc(r.from)+'">მიღება</button><button class="danger" data-reject="'+esc(r.from)+'">უარყოფა</button></span></div>').join(''):'';
 document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>openProfile(b.dataset.profile));
 document.querySelectorAll('[data-add]').forEach(b=>b.onclick=async()=>{try{await call('requestFriend',{targetId:b.dataset.add});showStatus('მოთხოვნა გაგზავნილია');await loadPeople()}catch(e){showStatus(e.message)}});
 document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>openDirect(b.dataset.chat));
 document.querySelectorAll('[data-video]').forEach(b=>b.onclick=()=>showStatus('ვიდეოზარი ჯერ არ არის ჩართული'));
 document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>showModal('კონტაქტის წაშლა','ნამდვილად გინდა კონტაქტის წაშლა?',async()=>{await call('removeFriend',{targetId:b.dataset.remove});await loadPeople()}));
 document.querySelectorAll('[data-accept]').forEach(b=>b.onclick=async()=>{await call('respondFriend',{targetId:b.dataset.accept,decision:'accept'});await loadPeople()});
 document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=async()=>{await call('respondFriend',{targetId:b.dataset.reject,decision:'reject'});await loadPeople()});
}
async function openProfile(id){
 selectedPerson=people.find(x=>x.id===id)||contacts.find(x=>x.id===id);if(!selectedPerson)return;
 const yes=contacts.some(x=>x.id===id);
 $('profileName').textContent=selectedPerson.name;$('profileState').textContent=yes?'კონტაქტებშია':'ჯერ კონტაქტი არ არის';
 $('profileChat').hidden=!yes;$('profileRemove').hidden=!yes;$('profileChatBox').hidden=true;
 $('profilePanel').hidden=false;$('profilePanel').scrollIntoView({behavior:'smooth',block:'start'});
}
$('backUsers').onclick=()=>{$('profilePanel').hidden=true;selectedPerson=null;if(directPoll)clearInterval(directPoll)};
$('profileChat').onclick=async()=>{if(!selectedPerson)return;directTarget=selectedPerson.id;$('profileChatBox').hidden=false;await loadDirect();if(directPoll)clearInterval(directPoll);directPoll=setInterval(()=>loadDirect().catch(()=>{}),3000)};
$('directSend').onclick=async()=>{const t=$('directText').value.trim();if(!t||!directTarget)return;try{await call('sendDirect',{targetId:directTarget,text:t});$('directText').value='';await loadDirect()}catch(e){showStatus(e.message)}};
$('directText').addEventListener('keydown',e=>{if(e.key==='Enter')$('directSend').click()});
$('profileVideo').onclick=()=>showStatus('ვიდეოზარი ჯერ არ არის ჩართული');
$('profileRemove').onclick=()=>{if(!selectedPerson)return;showModal('კონტაქტის წაშლა','ნამდვილად გინდა კონტაქტიდან წაშლა?',async()=>{await call('removeFriend',{targetId:selectedPerson.id});await loadPeople();$('profilePanel').hidden=true})};
$('profileBlock').onclick=async()=>{if(!selectedPerson)return;try{await call('block',{targetId:selectedPerson.id});showStatus('მომხმარებელი დაიბლოკა');$('profilePanel').hidden=true}catch(e){showStatus(e.message)}};
async function openDirect(id){await openProfile(id);if(contacts.some(x=>x.id===id))$('profileChat').click()}

async function loadDirect(){if(!directTarget)return;const list=await call('directMessages',{targetId:directTarget});const log=$('directLog');if(!log||$('profileChatBox').hidden)return;log.innerHTML=list.map(m=>'<div style="padding:6px 8px;margin:5px 0;border-radius:9px;background:'+(m.userId===uid?'#123d58':'#102b3b')+'"><small>'+esc(m.userName)+'</small><div>'+esc(m.text)+'</div></div>').join('');log.scrollTop=log.scrollHeight}
async function init(){if(!user||!uid||!token){showStatus('ჯერ TEMO1.gr-ზე შედი.');return}try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'session',sessionToken:token})});if(!r.ok)throw new Error('სესია ვადაგასულია. შედი თავიდან TEMO1.gr-ზე.');$('userName').textContent=user;$('app').hidden=false;showStatus('');try{await loadPeople()}catch(e){showStatus('მომხმარებლების სია ვერ ჩაიტვირთა. საჭიროა Cloudflare Worker-ის განახლება.')}}catch(e){$('app').hidden=false;$('userName').textContent=user;showStatus(e.message||'კავშირის შეცდომა')}}
init();
setInterval(()=>loadPeople().catch(()=>{}),5000);
})();
</script>
</body>
</html>
