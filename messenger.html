<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071117">
<title>TEMO Messenger</title>
<style>
:root{color-scheme:dark;--bg:#071117;--panel:#0d1b24;--panel2:#10232f;--line:#1e3542;--blue:#2999df;--text:#eef7f7;--muted:#9fb0b8}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#061015,#0b1c27);color:var(--text);font-family:Arial,sans-serif;min-height:100vh}
.app{max-width:900px;margin:auto;padding:12px 12px 30px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px 16px;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:800}.brand span{color:var(--blue)}.user{font-size:13px;color:var(--muted);text-align:right}
button,input{font:inherit}button{border:1px solid #285269;border-radius:10px;padding:10px 13px;background:#183445;color:white;font-weight:700;cursor:pointer}button.primary{background:#126ba0;border-color:#2999df}button.danger{background:#4a2228;border-color:#74333d}input{width:100%;padding:12px;border:1px solid #29404c;border-radius:10px;background:#071117;color:white;min-width:0}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:12px;margin-top:14px}.panel{border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,var(--panel),var(--panel2));padding:14px;min-width:0}
h2{font-size:16px;margin:0 0 12px}.createRow{display:flex;gap:7px;margin-bottom:9px}.createRow input{flex:1}.groupList{display:grid;gap:7px}.groupItem{width:100%;text-align:left;background:#0a1821;border-color:#203b4b}.groupItem.active{border-color:#2999df;box-shadow:0 0 8px #2999df66}.muted{color:var(--muted);font-size:13px}.chat{display:flex;flex-direction:column;min-height:65vh}.memberList{display:flex;gap:6px;overflow-x:auto;padding:9px 0;border-bottom:1px solid var(--line)}.memberChip{display:flex;align-items:center;gap:6px;white-space:nowrap;background:#0a1821;border:1px solid #29404c;border-radius:20px;padding:5px 8px;font-size:12px}.memberChip button{padding:4px 7px;font-size:11px}.personRow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0a1821;border:1px solid #203b4b;border-radius:12px;padding:9px;min-width:0}.personName{font-size:14px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.personActions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;flex-shrink:0}.personActions button{padding:7px 5px;font-size:11px;border-radius:8px;white-space:nowrap;min-width:0}.personActions button:disabled{opacity:.55}.requestRow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}#contacts,#allUsers{display:grid;grid-template-columns:1fr;gap:8px}#incomingRequests{margin-bottom:10px}#allUsers>.muted,#contacts>.muted{padding:4px 2px;font-weight:700;color:#b8cbd3}.chatHead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line)}.messages{flex:1;min-height:280px;max-height:58vh;overflow:auto;padding:12px 2px;display:flex;flex-direction:column;gap:9px}.msg{max-width:88%;align-self:flex-start;background:#102b3b;border:1px solid #23495f;border-radius:13px;padding:9px 11px;overflow-wrap:anywhere}.msg.mine{align-self:flex-end;background:#123d58}.msg small{display:block;color:#9fb0b8;font-size:11px;margin-bottom:4px}.sendRow{display:flex;gap:7px}.sendRow input{flex:1}.empty{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);gap:10px}.bubble{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;background:#102b3b;border:1px solid #285269;font-size:28px}.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.status{padding:18px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modal.show{display:flex}.modalBox{width:min(390px,100%);background:#10232f;border:1px solid #285269;border-radius:16px;padding:18px}.modalBox input{margin:10px 0}.modalActions{display:flex;gap:8px}.modalActions button{flex:1}
@media(max-width:680px){.layout{grid-template-columns:1fr}.chat{min-height:58vh}.messages{max-height:48vh;min-height:220px}.groupList{grid-template-columns:1fr}.groupItem{font-size:13px;padding:10px}.app{padding:8px 8px 20px}.personRow{display:flex;flex-direction:column;align-items:stretch;gap:9px;padding:10px}.personName{font-size:15px}.personActions{width:100%;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.personActions button{font-size:11px;padding:9px 2px}.panel{padding:12px}}
</style>
</head>
<body>
<div class="app" id="app" hidden>
<header><div class="brand">TEMO <span>MESSENGER</span></div><div class="user" id="userName"></div></header>
<div class="layout">
<section class="panel" style="margin-top:14px"><h2>მომხმარებლები</h2><div id="incomingRequests" class="muted"></div><div id="contacts" class="groupList" style="margin-bottom:12px"></div><div id="allUsers" class="groupList"></div></section>
<aside class="panel">
<h2>ჩემი ჯგუფები</h2>
<div class="createRow"><input id="newGroup" maxlength="50" placeholder="ჯგუფის სახელი"><button class="primary" id="createBtn">+</button></div>
<div class="groupList" id="groupList"></div>
<div class="tools"><button id="joinBtn">ჯგუფში შესვლა</button><button id="blockedBtn">დაბლოკილები</button></div>
</aside>
<section class="panel chat">
<div id="chatEmpty" class="empty"><div class="bubble">💬</div><strong>აირჩიე ჯგუფი</strong><div class="muted">შექმენი ახალი ჯგუფი ან შეუერთდი მოწვევის კოდით.</div></div>
<div id="chatArea" hidden>
<div class="chatHead"><div><b id="groupTitle"></b><div class="muted" id="memberCount"></div></div><button id="inviteBtn">მოწვევა</button></div>
<div class="memberList" id="memberList"></div><div class="messages" id="messages"></div>
<div class="sendRow"><input id="messageInput" maxlength="2000" placeholder="დაწერე შეტყობინება..."><button class="primary" id="sendBtn">გაგზავნა</button></div>
</div>
</section>
</div>
<div class="status" id="status">მოწმდება შესვლა...</div>
</div>
<div class="modal" id="modal"><div class="modalBox"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="modalActions"><button id="modalCancel">დახურვა</button><button class="primary" id="modalOk">კარგი</button></div></div></div>
<script>
(()=>{
const API='https://temo1-firebase-bridge.temo75elia.workers.dev',user=localStorage.getItem('temoWorkTrackerUser')||'',uid=localStorage.getItem('temoWorkTrackerUserId')||'',token=localStorage.getItem('temoFirebaseBridgeSession')||'';
const $=id=>document.getElementById(id);let groups=[],active=null,poll=null,modalAction=null;
const call=async(op,data={})=>{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'messenger',op,...data,sessionToken:token})});const j=await r.json();if(!r.ok)throw new Error(j.error||'შეცდომა');return j};
const showModal=(title,html,fn)=>{$('modalTitle').textContent=title;$('modalBody').innerHTML=html;modalAction=fn;$('modal').classList.add('show')};
const closeModal=()=>{$('modal').classList.remove('show');modalAction=null};
$('modalCancel').onclick=closeModal;$('modalOk').onclick=async()=>{if(modalAction)await modalAction();closeModal()};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showStatus(t){$('status').textContent=t}
let people=[],contacts=[],requests=[],directTarget=null,directPoll=null;
function personRow(u){const yes=contacts.some(c=>c.id===u.id);return '<div class="personRow"><span class="personName">'+esc(u.name)+'</span><span class="personActions">'+(yes?'<button disabled>✓ დამატებულია</button>':'<button data-add="'+esc(u.id)+'">＋ დამატება</button>')+'<button data-chat="'+esc(u.id)+'">ჩატი</button><button class="video" data-video="'+esc(u.id)+'">ვიდეო</button>'+(yes?'<button class="danger" data-remove="'+esc(u.id)+'">წაშლა</button>':'<button class="danger" disabled>წაშლა</button>')+'</span></div>'}
async function loadPeople(){
 [people,contacts,requests]=await Promise.all([call('users'),call('contacts'),call('requests')]);
 $('contacts').innerHTML=contacts.length?'<div class="muted">ჩემი კონტაქტები</div>'+contacts.map(personRow).join(''):'<div class="muted">კონტაქტები ჯერ არ არის</div>';
 $('allUsers').innerHTML='<div class="muted">რეგისტრირებული მომხმარებლები</div>'+people.map(personRow).join('');
 $('incomingRequests').innerHTML=requests.length?'<b>მეგობრობის მოთხოვნები</b>'+requests.map(r=>'<div class="requestRow"><span>'+esc(r.name)+'</span><span class="personActions"><button data-accept="'+esc(r.from)+'">მიღება</button><button class="danger" data-reject="'+esc(r.from)+'">უარყოფა</button></span></div>').join(''):'';
 document.querySelectorAll('[data-add]').forEach(b=>b.onclick=async()=>{try{await call('requestFriend',{targetId:b.dataset.add});showStatus('მოთხოვნა გაგზავნილია');await loadPeople()}catch(e){showStatus(e.message)}});
 document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>openDirect(b.dataset.chat));
 document.querySelectorAll('[data-video]').forEach(b=>b.onclick=()=>showStatus('ვიდეოზარი ჯერ არ არის ჩართული'));
 document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>showModal('კონტაქტის წაშლა','ნამდვილად გინდა კონტაქტის წაშლა?',async()=>{await call('removeFriend',{targetId:b.dataset.remove});await loadPeople()}));
 document.querySelectorAll('[data-accept]').forEach(b=>b.onclick=async()=>{await call('respondFriend',{targetId:b.dataset.accept,decision:'accept'});await loadPeople()});
 document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=async()=>{await call('respondFriend',{targetId:b.dataset.reject,decision:'reject'});await loadPeople()});
}
async function openDirect(id){
 const person=people.find(x=>x.id===id)||contacts.find(x=>x.id===id);if(!person)return;
 if(!contacts.some(x=>x.id===id)){showStatus('ჯერ მეგობრობის მოთხოვნა უნდა მიიღოს.');return}
 directTarget=id;showModal('ჩატი · '+person.name,'<div id="directLog" style="max-height:42vh;overflow:auto;margin-bottom:10px"></div><input id="directText" maxlength="2000" placeholder="შეტყობინება...">',async()=>{const t=$('directText')?.value?.trim();if(t){await call('sendDirect',{targetId:id,text:t});await loadDirect()}});
 await loadDirect();if(directPoll)clearInterval(directPoll);directPoll=setInterval(()=>{if(directTarget===id&&$('modal').classList.contains('show'))loadDirect().catch(()=>{})},3000);
}
async function loadDirect(){if(!directTarget)return;const list=await call('directMessages',{targetId:directTarget});const log=$('directLog');if(!log)return;log.innerHTML=list.map(m=>'<div style="padding:6px 8px;margin:5px 0;border-radius:9px;background:'+(m.userId===uid?'#123d58':'#102b3b')+'"><small>'+esc(m.userName)+'</small><div>'+esc(m.text)+'</div></div>').join('');log.scrollTop=log.scrollHeight}
async function loadGroups(){groups=await call('groups');$('groupList').innerHTML=groups.map(g=>'<button class="groupItem '+(active?.id===g.id?'active':'')+'" data-id="'+esc(g.id)+'">'+esc(g.title)+'</button>').join('')||'<div class="muted">ჯგუფები ჯერ არ არის</div>';document.querySelectorAll('.groupItem').forEach(b=>b.onclick=()=>selectGroup(b.dataset.id))}
async function selectGroup(id){active=groups.find(g=>g.id===id);if(!active)return;$('chatEmpty').hidden=true;$('chatArea').hidden=false;$('groupTitle').textContent=active.title;$('memberCount').textContent=active.members.length+' წევრი';await loadMembers();await loadMessages();await loadGroups();if(poll)clearInterval(poll);poll=setInterval(()=>loadMessages().catch(()=>{}),3000)}
async function loadMembers(){if(!active)return;const data=await call('members',{groupId:active.id});$('memberList').innerHTML=data.members.map(m=>'<span class="memberChip">'+esc(m.name)+(m.id===uid?' (შენ)':'')+(m.id!==uid?'<button data-block="'+esc(m.id)+'">'+(data.blockedIds.includes(m.id)?'განბლოკვა':'დაბლოკვა')+'</button>':'')+'</span>').join('');$('memberList').querySelectorAll('[data-block]').forEach(b=>b.onclick=async()=>{try{const id=b.dataset.block;const blocked=b.textContent==='დაბლოკვა';await call(blocked?'block':'unblock',{targetId:id});await loadMembers()}catch(e){showStatus(e.message)}})}
async function loadMessages(){if(!active)return;const list=await call('messages',{groupId:active.id});$('messages').innerHTML=list.map(m=>'<div class="msg '+(m.userId===uid?'mine':'')+'"><small>'+esc(m.userName)+' · '+new Date(m.createdAt).toLocaleString()+'</small>'+esc(m.text)+'</div>').join('');$('messages').scrollTop=$('messages').scrollHeight}
async function send(){const text=$('messageInput').value.trim();if(!text||!active)return;await call('send',{groupId:active.id,text});$('messageInput').value='';await loadMessages()}
$('createBtn').onclick=async()=>{try{const title=$('newGroup').value.trim();if(!title)return;const g=await call('create',{title});$('newGroup').value='';await loadGroups();await selectGroup(g.id);showModal('ჯგუფი შეიქმნა','მოწვევის კოდი: <b>'+esc(g.inviteCode)+'</b>',null)}catch(e){showStatus(e.message)}};
$('joinBtn').onclick=()=>showModal('ჯგუფში შესვლა','<input id="inviteCode" placeholder="მოწვევის კოდი" maxlength="20">',async()=>{const inviteCode=$('inviteCode').value.trim();const g=await call('join',{inviteCode});await loadGroups();await selectGroup(g.id)});
$('sendBtn').onclick=()=>send().catch(e=>showStatus(e.message));$('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter')send().catch(x=>showStatus(x.message))});
$('inviteBtn').onclick=()=>showModal('მოწვევის კოდი','კოდი: <b>'+esc(active?.inviteCode||'')+'</b>',null);
$('blockedBtn').onclick=async()=>{try{const items=await call('blocked');showModal('დაბლოკილები',items.length?items.map(x=>'<div style="display:flex;justify-content:space-between;gap:8px;margin:8px 0">'+esc(x.name)+' <button data-unblock="'+esc(x.id)+'">განბლოკვა</button></div>').join(''):'არავინ არის დაბლოკილი',async()=>{});$('modalBody').querySelectorAll('[data-unblock]').forEach(b=>b.onclick=async()=>{await call('unblock',{targetId:b.dataset.unblock});b.parentElement.remove()})}catch(e){showStatus(e.message)}};
async function init(){if(!user||!uid||!token){showStatus('ჯერ TEMO1.gr-ზე შედი.');setTimeout(()=>location.replace('./'),900);return}try{await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'session',sessionToken:token})}).then(async r=>{if(!r.ok)throw new Error();});$('userName').textContent=user;$('app').hidden=false;showStatus('');await loadGroups();await loadPeople()}catch(e){showStatus('სესია ვადაგასულია. შედი თავიდან TEMO1.gr-ზე.');setTimeout(()=>location.replace('./'),1200)}}
init();
setInterval(()=>loadPeople().catch(()=>{}),5000);
})();
</script>
</body>
</html>
