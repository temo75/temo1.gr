<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071117">
<title>TEMO Messenger</title>
<style>
:root{color-scheme:dark;--bg:#071117;--panel:#0d1b24;--panel2:#10232f;--line:#1e3542;--blue:#2999df;--text:#eef7f7;--muted:#9fb0b8}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#061015,#0b1c27);color:var(--text);font-family:Arial,sans-serif;min-height:100vh}
.app{max-width:900px;margin:auto;padding:16px 14px 90px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px 18px;border-bottom:1px solid var(--line)}
.brand{font-size:23px;font-weight:800;letter-spacing:.4px}.brand span{color:var(--blue)}
.user{font-size:13px;color:var(--muted);text-align:right}
.panel{margin-top:16px;padding:20px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,var(--panel),var(--panel2));min-height:230px}
h2{font-size:18px;margin:0 0 10px}.empty{min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);gap:10px}
.bubble{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;background:#102b3b;border:1px solid #285269;font-size:28px;box-shadow:0 0 18px #2999df33}
.note{font-size:13px;line-height:1.5;max-width:320px}
button{border:1px solid #285269;border-radius:10px;padding:10px 14px;background:#183445;color:white;font-weight:700}
#status{padding:24px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="app" id="app" hidden>
<header><div class="brand">TEMO <span>MESSENGER</span></div><div class="user" id="userName"></div></header>
<section class="panel">
<h2>ჩემი ჯგუფები</h2>
<div class="empty"><div class="bubble">💬</div><strong>მოგესალმები TEMO Messenger-ში</strong><div class="note">აქ ავაწყობთ ჯგუფებს, მიმოწერას და ვიდეოზარებს.</div></div>
</section>
</div>
<div id="status">მოწმდება შესვლა...</div>
<script>
(async function(){
  const USER_KEY='temoWorkTrackerUser';
  const ID_KEY='temoWorkTrackerUserId';
  const TOKEN_KEY='temoFirebaseBridgeSession';
  const user=localStorage.getItem(USER_KEY)||'';
  const userId=localStorage.getItem(ID_KEY)||'';
  const token=localStorage.getItem(TOKEN_KEY)||'';
  const status=document.getElementById('status');
  if(!user||!userId||!token){
    status.textContent='Messenger-ში შესასვლელად ჯერ TEMO1.gr-ზე შედი.';
    setTimeout(()=>location.replace('./'),900);
    return;
  }
  try{
    const response=await fetch('https://temo1-firebase-bridge.temo75elia.workers.dev',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'listUsers',sessionToken:token})
    });
    if(!response.ok)throw new Error('session');
    const users=await response.json();
    const valid=Array.isArray(users)&&users.some(u=>String(u.id||'')===userId&&!u.blocked&&u.authorized!==false);
    if(!valid)throw new Error('user');
    document.getElementById('userName').textContent=user;
    document.getElementById('app').hidden=false;
    status.remove();
  }catch(e){
    status.textContent='სესია ვადაგასულია. შედი თავიდან TEMO1.gr-ზე.';
    localStorage.removeItem(TOKEN_KEY);
    setTimeout(()=>location.replace('./'),1200);
  }
})();
</script>
</body>
</html>
