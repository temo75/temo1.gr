<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEMO — ჩემი გადასახადები (სატესტო)</title>
<style>
:root{color-scheme:dark;--bg:#06151b;--card:#0c2028;--line:#294854;--text:#edf7fb;--muted:#9db1ba;--blue:#55bfff;--gold:#ffd36b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#102b35 0,#06151b 65%);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
header{max-width:760px;margin:auto;padding:30px 22px 0}.logo{font-size:34px;margin-bottom:26px}.pill{display:inline-block;border:1px solid #80672c;border-radius:20px;padding:4px 10px;color:var(--gold);font-size:12px;margin-bottom:18px}
main{max-width:760px;margin:auto;padding:18px 22px 40px}h1{font-size:clamp(30px,7vw,42px);margin:0;font-weight:800;letter-spacing:-.8px} .sub{color:var(--muted);font-size:21px;margin:8px 0 26px}
.notice{border:1px solid #80672c;background:#2b2515;color:#f8e7b7;padding:12px 14px;border-radius:14px;font-size:14px;margin:0 0 22px}
.cards{display:grid;gap:16px}.card{display:flex;align-items:center;gap:18px;width:100%;text-align:left;padding:17px 18px;border:1px solid var(--line);border-radius:27px;background:linear-gradient(120deg,#102932,#0a1c23);color:var(--text);min-height:150px;cursor:pointer;box-shadow:0 8px 25px #0002}.card:focus,.card.active{border-color:var(--blue);outline:none}.ico{display:grid;place-items:center;flex:0 0 76px;height:90px;border-radius:25px;background:#163947;font-size:44px}.words{flex:1;min-width:0}.words strong{display:block;font-size:25px;margin-bottom:5px}.words span{display:block;color:var(--muted);font-size:18px;line-height:1.35}.arrow{color:var(--blue);font-size:30px}
.detail{margin-top:20px;padding:18px;border:1px solid var(--line);border-radius:20px;background:#0a1e25}.detail h2{margin:0 0 10px;font-size:21px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.filters input,.filters select{min-width:0;flex:1;background:#07171d;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px;font:inherit}.record{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.record:last-child{border:0}.muted{color:var(--muted);font-size:14px}.amount{font-weight:800;white-space:nowrap}.demo{color:var(--gold);font-size:12px}.bottom{position:sticky;bottom:0;padding:10px 22px 14px;background:linear-gradient(transparent,#06151b 24%);display:flex;justify-content:flex-start}.home{border:1px solid var(--blue);background:#102b38;border-radius:24px;padding:12px 20px;font-size:30px}
@media(max-width:420px){header{padding-top:26px}main{padding-left:18px;padding-right:18px}.card{gap:13px;padding:15px;min-height:136px}.ico{flex-basis:68px;height:78px;font-size:38px}.words strong{font-size:23px}.words span{font-size:16px}.record{font-size:14px}}
</style></head>
<body><header><div class="logo">💶</div><span class="pill">ცალკე სატესტო გვერდი · DEMO</span><h1>ჩემი გადასახადები</h1><div class="sub">აირჩიე კატეგორია</div></header>
<main><div class="notice"><strong>სატესტო ვერსია:</strong> ქვემოთ ნაჩვენებია მხოლოდ მაგალითები. ეს გვერდი ჯერ არ უკავშირდება Gmail-ს და რეალურ ქვითრებს არ კითხულობს. არსებულ საიტზე გავლენა არ აქვს.</div>
<div class="cards">
<button class="card active" data-kind="DEI"><span class="ico">⚡</span><span class="words"><strong>ΔΕΗ — დენი</strong><span>ელექტროენერგიის ქვითრები</span></span><span class="arrow">›</span></button>
<button class="card" data-kind="NOVA"><span class="ico">📊</span><span class="words"><strong>NOVA</strong><span>ტელეფონი და ინტერნეტი</span></span><span class="arrow">›</span></button>
<button class="card" data-kind="წყალი"><span class="ico">💧</span><span class="words"><strong>წყალი</strong><span>წყლის გადასახადები</span></span><span class="arrow">›</span></button>
<button class="card" data-kind="ბანკი"><span class="ico">🏦</span><span class="words"><strong>ბანკი</strong><span>ბანკის გადასახადები</span></span><span class="arrow">›</span></button>
</div>
<section class="detail"><h2 id="heading">ΔΕΗ — დენი</h2><div class="demo">● სატესტო მონაცემები</div><div class="filters"><input id="q" placeholder="მოძებნე ქვითარი…" aria-label="მოძებნე"><select id="status"><option value="all">ყველა</option><option value="due">გადასახდელი</option><option value="paid">გადახდილი</option></select></div><div id="rows"></div></section>
</main><div class="bottom"><div class="home">⌂</div></div>
<script>
const data={
"DEI":[{name:"დენის ქვითარი — მაგალითი A",date:"14.09.2026",amount:86.42,due:"30.10.2026",status:"due"},{name:"დენის ქვითარი — მაგალითი B",date:"12.08.2026",amount:74.10,due:"31.08.2026",status:"paid"}],
"NOVA":[{name:"NOVA — ინვოისი A",date:"02.10.2026",amount:39.90,due:"25.10.2026",status:"due"},{name:"NOVA — ინვოისი B",date:"02.09.2026",amount:39.90,due:"25.09.2026",status:"paid"}],
"წყალი":[{name:"წყლის ქვითარი — მაგალითი",date:"01.10.2026",amount:28.50,due:"30.10.2026",status:"due"}],
"ბანკი":[{name:"ბანკის გადახდა — მაგალითი",date:"05.10.2026",amount:50,due:"05.11.2026",status:"due"}]};
let kind="DEI";const euro=n=>new Intl.NumberFormat("el-GR",{style:"currency",currency:"EUR"}).format(n);
function render(){document.getElementById("heading").textContent=({"DEI":"ΔΕΗ — დენი","NOVA":"NOVA","წყალი":"წყალი","ბანკი":"ბანკი"})[kind];const q=document.getElementById("q").value.toLowerCase(),s=document.getElementById("status").value;const list=data[kind].filter(x=>(s==="all"||x.status===s)&&x.name.toLowerCase().includes(q));document.getElementById("rows").innerHTML=list.length?list.map(x=>'<div class="record"><div><strong>'+x.name+'</strong><div class="muted">ელფოსტა: '+x.date+' · ვადა: '+x.due+'</div><div class="muted">'+(x.status==="due"?"გადასახდელია":"გადახდილია")+'</div></div><div class="amount">'+euro(x.amount)+'</div></div>').join(""):'<p class="muted">ამ ფილტრით ჩანაწერი ვერ მოიძებნა.</p>'}
document.querySelectorAll("[data-kind]").forEach(b=>b.addEventListener("click",()=>{kind=b.dataset.kind;document.querySelectorAll(".card").forEach(x=>x.classList.toggle("active",x===b));render()}));document.getElementById("q").addEventListener("input",render);document.getElementById("status").addEventListener("change",render);render();
</script></body></html>
