<script>
(()=>{
const API='https://temo1-firebase-bridge.temo75elia.workers.dev',user=localStorage.getItem('temoWorkTrackerUser')||'',uid=localStorage.getItem('temoWorkTrackerUserId')||'';
const getToken=()=>localStorage.getItem('temoFirebaseBridgeSession')||'';
const $=id=>document.getElementById(id);let modalAction=null;

async function ensureMessengerPush(){
 if(location.origin!=='https://temo1.gr'||Notification.permission!=='granted'||!('serviceWorker'in navigator)||!('PushManager'in window))return;
 const me=localStorage.getItem('temoWorkTrackerUserId')||uid;
 const session=localStorage.getItem('temoFirebaseBridgeSession')||getToken();
 if(!me||!session)return;
 const worker='https://temo-ai.temo75elia.workers.dev';
 const cfg=await fetch(worker+'?action=push-config',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Push config HTTP '+r.status);return r.json()});
 if(!cfg.ok||!cfg.publicKey)throw Error(cfg.error||'Push key unavailable');
 const s=cfg.publicKey.replace(/-/g,'+').replace(/_/g,'/');
 const raw=atob(s+'='.repeat((4-s.length%4)%4)),key=new Uint8Array(raw.length);
 for(let i=0;i<raw.length;i++)key[i]=raw.charCodeAt(i);
 await navigator.serviceWorker.register('/temo-notes-sw.js',{scope:'/'});
 const reg=await navigator.serviceWorker.ready;
 let sub=await reg.pushManager.getSubscription();
 if(sub){const old=sub.options?.applicationServerKey;if(old&& (old.byteLength!==key.length||!key.every((v,i)=>v===new Uint8Array(old)[i]))){await sub.unsubscribe();sub=null;}}
 if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});
 const deviceKey='temoPushDeviceId';let deviceId=localStorage.getItem(deviceKey);
 if(!deviceId){deviceId=crypto.randomUUID?crypto.randomUUID():'d_'+Date.now();localStorage.setItem(deviceKey,deviceId);}
 const response=await fetch(worker,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'push-subscribe',userId:me,sessionToken:session,deviceId,platform:/Android/i.test(navigator.userAgent)?'android-native':'web-push',subscription:sub.toJSON()})});
 const result=await response.json().catch(()=>({}));
 if(!response.ok||!result.ok)throw Error(result.error||('Push subscribe HTTP '+response.status));
}
const call=async(op,data={})=>{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'messenger',op,...data,sessionToken:getToken()})});const j=await r.json();if(!r.ok)throw new Error(j.error||'შეცდომა');return j};
const VOICE_API='https://temo-messenger-test-voice.temo75elia.workers.dev';
let voiceRecorder=null,voiceChunks=[],pendingVoice=null,voiceStartedAt=0,voiceDurationMs=0,voiceHoldActive=false,voiceReleasePending=false,voiceStarting=false;
const voiceButton=$('voiceRecord');
async function beginVoiceHold(){
 if(voiceStarting||voiceRecorder||pendingVoice)return;
 voiceHoldActive=true;voiceReleasePending=false;voiceStarting=true;
 try{
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('ამ ბრაუზერში ხმოვანი ჩაწერა მიუწვდომელია');
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  if(!voiceHoldActive||voiceReleasePending){stream.getTracks().forEach(t=>t.stop());voiceHoldActive=false;return}

const VOICE_RE=/^\[\[TEMO_VOICE:([^:]+):([^:]+):(\d+)\]\]$/;
function voiceMarkup(text){
 const m=String(text||"").match(VOICE_RE);if(!m)return null;
 return '<div class="voiceMessage"><button type="button" class="voicePlay" data-voice-id="'+esc(m[1])+'" data-voice-mime="'+esc(decodeURIComponent(m[2]))+'">▶ მოსმენა</button><span class="muted">'+Math.max(1,Math.round(Number(m[3])/1000))+' წმ.</span></div>';
}
async function loadDirect(){if(!directTarget)return;const list=await call('directMessages',{targetId:directTarget});const log=$('directLog');if(!log||$('profileChatBox').hidden)return;log.innerHTML=list.map(m=>{const voice=voiceMarkup(m.text);return '<div class="msg '+(m.userId===uid?'mine':'')+'" data-message-id="'+esc(m.id||'')+'" data-message-text="'+esc(m.text)+'"><small>'+esc(m.userName)+'</small><div>'+(voice||esc(m.text))+'</div></div>'}).join('');log.scrollTop=log.scrollHeight}

let messageActionPopup=null;function closeMessageActionPopup(){if(messageActionPopup){messageActionPopup.remove();messageActionPopup=null}document.removeEventListener('pointerdown',outsideMessageActionPopup,true)}function outsideMessageActionPopup(e){if(messageActionPopup&&!messageActionPopup.contains(e.target))closeMessageActionPopup()}function messageActions(el){if(!el||!el.classList.contains('mine'))return;const messageId=el.dataset.messageId;if(!messageId)return;closeMessageActionPopup();const popup=document.createElement('div');popup.className='messageActionPopup';popup.innerHTML='<button type="button" id="editOwnMessage" aria-label="შესწორება" title="შესწორება"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 16.5-.8 4.3 4.3-.8L20 7.5 16.5 4 4 16.5Z"/><path d="m14.8 5.7 3.5 3.5"/></svg></button><button type="button" id="deleteOwnMessage" aria-label="წაშლა" title="წაშლა"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6m4-6v6M5 7l1 14h12l1-14M9 7V4h6v3"/></svg></button>';document.body.appendChild(popup);messageActionPopup=popup;const rect=el.getBoundingClientRect();const width=popup.offsetWidth,height=popup.offsetHeight;popup.style.left=Math.max(8,Math.min(innerWidth-width-8,rect.left+(rect.width-width)/2))+'px';popup.style.top=Math.max(8,rect.top-height-9)+'px';$('editOwnMessage').onclick=()=>{closeMessageActionPopup();const current=el.dataset.messageText||'';showModal('შეტყობინების შესწორება','<textarea id="editMessageText" maxlength="2000" style="width:100%;min-height:100px;box-sizing:border-box">'+esc(current)+'</textarea>',async()=>{const text=$('editMessageText').value.trim();if(!text)throw new Error('ტექსტი ცარიელია');await call('editDirect',{targetId:directTarget,messageId,text});await loadDirect()})};$('deleteOwnMessage').onclick=()=>{closeMessageActionPopup();showModal('შეტყობინების წაშლა','ნამდვილად გინდა ამ ტექსტის წაშლა?',async()=>{await call('deleteDirect',{targetId:directTarget,messageId});await loadDirect()})};setTimeout(()=>document.addEventListener('pointerdown',outsideMessageActionPopup,true),0)}
const directLog=$('directLog');let pressTimer=null,pressStart=null,lastLongPressAt=0;function clearMessagePress(){if(pressTimer)clearTimeout(pressTimer);pressTimer=null;pressStart=null}directLog.addEventListener('pointerdown',e=>{if(e.button!==0)return;const el=e.target.closest('.msg.mine');if(!el)return;clearMessagePress();pressStart={x:e.clientX,y:e.clientY};pressTimer=setTimeout(()=>{pressTimer=null;lastLongPressAt=Date.now();messageActions(el)},600)});directLog.addEventListener('pointermove',e=>{if(!pressStart)return;if(Math.hypot(e.clientX-pressStart.x,e.clientY-pressStart.y)>14)clearMessagePress()},{passive:true});['pointerup','pointercancel','pointerleave'].forEach(type=>directLog.addEventListener(type,clearMessagePress,{passive:true}));directLog.addEventListener('contextmenu',e=>{const el=e.target.closest('.msg.mine');if(el){e.preventDefault();if(Date.now()-lastLongPressAt>900)messageActions(el)}});
async function init(){$('app').hidden=false;const activeToken=getToken();if(!user||!uid||!activeToken){showStatus('TEMO1.gr-ში შედი და შემდეგ გახსენი ეს გვერდი.');return}$('userName').textContent=user;showStatus('');try{await loadPeople()}catch(e){showStatus(e.message||'მომხმარებლების სია ვერ ჩაიტვირთა')}}

// Long-press TEST to open theme picker (test page only)
const testThemeButton=$('testThemeHold'),themePicker=$('themePicker');let themeHoldTimer=null,themeHoldFired=false;
const testThemes={ocean:{bg:'linear-gradient(145deg,#061015,#0b1c27)',panel:'#0d1b24',panel2:'#10232f',line:'#1e3542',blue:'#2999df',incoming:'#e51d35',outgoing:'#08bce9'},forest:{bg:'linear-gradient(145deg,#071812,#12382c)',panel:'#10271f',panel2:'#17392d',line:'#315b48',blue:'#5ac78b',incoming:'#d66b70',outgoing:'#68d7a0'},sunset:{bg:'linear-gradient(145deg,#24121b,#542c37)',panel:'#321d29',panel2:'#4a2934',line:'#75414c',blue:'#ff9b70',incoming:'#ff7289',outgoing:'#ffc078'},violet:{bg:'linear-gradient(145deg,#120d24,#292047)',panel:'#211a38',panel2:'#30264d',line:'#514276',blue:'#b58cff',incoming:'#e47ab4',outgoing:'#8fc8ff'},rose:{bg:'linear-gradient(145deg,#211019,#3b1c2d)',panel:'#321b2b',panel2:'#48243a',line:'#713b59',blue:'#ff83ad',incoming:'#ff6b88',outgoing:'#75d9f5'},gold:{bg:'linear-gradient(145deg,#17140b,#342b16)',panel:'#282215',panel2:'#3a311d',line:'#67552d',blue:'#f4d16b',incoming:'#df6674',outgoing:'#f4d16b'},aurora:{bg:'radial-gradient(ellipse at 18% 18%,#176b75 0%,transparent 38%),radial-gradient(ellipse at 82% 72%,#4d267e 0%,transparent 42%),linear-gradient(145deg,#06151d,#101a38 58%,#07131d)',panel:'#102b3a',panel2:'#173b4b',line:'#397c91',blue:'#62f4df',incoming:'#ff6c9d',outgoing:'#68eaff',glow:'#62f4df',shadow:'#07111c'},crystal:{bg:'radial-gradient(ellipse at 50% 0%,#345f9a 0%,transparent 42%),linear-gradient(145deg,#071322,#162c4a 55%,#081321)',panel:'#142c47',panel2:'#1b3b5d',line:'#4c83b8',blue:'#9bdcff',incoming:'#c4a5ff',outgoing:'#8ce8ff',glow:'#9bdcff',shadow:'#06101e'},nebula:{bg:'radial-gradient(ellipse at 20% 25%,#692d88 0%,transparent 40%),radial-gradient(ellipse at 82% 65%,#174e82 0%,transparent 43%),linear-gradient(145deg,#10091f,#20143c 60%,#080d1c)',panel:'#24183b',panel2:'#352354',line:'#70549b',blue:'#d5a0ff',incoming:'#ff8acb',outgoing:'#8edbff',glow:'#d5a0ff',shadow:'#090516'},liquidGold:{bg:'radial-gradient(ellipse at 50% 0%,#73551d 0%,transparent 43%),linear-gradient(145deg,#100f0b,#302513 55%,#090d10)',panel:'#2c2518',panel2:'#45371f',line:'#987536',blue:'#ffdf83',incoming:'#ff8c82',outgoing:'#ffe29a',glow:'#ffdf83',shadow:'#100b04'}};
function applyTestTheme(name){const t=testThemes[name]||testThemes.ocean,root=document.documentElement;root.style.setProperty('--bg',t.bg);root.style.setProperty('--panel',t.panel);root.style.setProperty('--panel2',t.panel2);root.style.setProperty('--line',t.line);root.style.setProperty('--blue',t.blue);root.style.setProperty('--theme-glow',t.glow||t.blue);root.style.setProperty('--theme-shadow',t.shadow||'#000000');document.body.style.background=t.bg;document.body.style.backgroundAttachment='fixed';document.querySelectorAll('.msg').forEach(x=>x.style.borderColor=t.incoming);document.querySelectorAll('.msg.mine').forEach(x=>x.style.borderColor=t.outgoing);localStorage.setItem('temoMessengerTestTheme',name);document.querySelectorAll('.themeChoice').forEach(x=>x.classList.toggle('active',x.dataset.theme===name));}
function openTestThemes(){applyTestTheme(localStorage.getItem('temoMessengerTestTheme')||'ocean');themePicker.classList.add('show');themePicker.setAttribute('aria-hidden','false');}
function closeTestThemes(){themePicker.classList.remove('show');themePicker.setAttribute('aria-hidden','true');}
testThemeButton.addEventListener('contextmenu',e=>e.preventDefault());testThemeButton.addEventListener('pointerdown',e=>{themeHoldFired=false;clearTimeout(themeHoldTimer);themeHoldTimer=setTimeout(()=>{themeHoldFired=true;openTestThemes()},550)});['pointerup','pointercancel','pointerleave'].forEach(ev=>testThemeButton.addEventListener(ev,()=>clearTimeout(themeHoldTimer)));testThemeButton.addEventListener('click',e=>{if(themeHoldFired){e.preventDefault();e.stopPropagation();themeHoldFired=false}});$('closeThemePicker').onclick=closeTestThemes;document.querySelectorAll('.themeChoice').forEach(b=>b.onclick=()=>{applyTestTheme(b.dataset.theme);closeTestThemes()});applyTestTheme(localStorage.getItem('temoMessengerTestTheme')||'ocean');

// Pull down at the top of the page to refresh
let pullStartY=0, pullStartX=0, pullEligible=false;
document.addEventListener('touchstart',e=>{
 const t=e.target;
 pullEligible=window.scrollY<=0 && !t.closest('input,textarea,button,.messages,#profilePanel,#videoCall,.videoBox');
 if(pullEligible&&e.touches.length===1){pullStartY=e.touches[0].clientY;pullStartX=e.touches[0].clientX}else pullEligible=false;
},{passive:true});
document.addEventListener('touchend',e=>{
 if(!pullEligible||!e.changedTouches.length)return;
 const dy=e.changedTouches[0].clientY-pullStartY;
 const dx=Math.abs(e.changedTouches[0].clientX-pullStartX);
 pullEligible=false;
 if(dy>85&&dy>dx*1.4)window.location.reload();
},{passive:true});

init();
setInterval(()=>loadPeople().catch(()=>{}),5000);
})();
</script>
